name: Release

# A tag <library>-<version>-<revision> builds that library, packages it and
# releases it under the tag. Pull requests build the libraries whose scripts
# they change, and a manual run builds the library it names; both upload the
# packages as workflow artifacts, at revision 0, without releasing.
on:
  push:
    tags:
      - libass-*
      - mpv-*
      - media3-ffmpeg-*
  pull_request:
  workflow_dispatch:
    inputs:
      library:
        description: The library to build
        type: choice
        options: [libass, mpv, media3-ffmpeg]
        required: true

permissions:
  contents: read

jobs:
  # The builds to run: each library with its runner and time limit, and the
  # revision to package them at.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          LIBRARY: ${{ inputs.library }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          revision=0
          case $EVENT in
          push)
            if ! printf '%s\n' "$TAG" | grep -Eq '^(libass|mpv|media3-ffmpeg)-[0-9A-Za-z.]+-[1-9][0-9]*$'; then
              echo "::error::$TAG is not <library>-<version>-<revision>"
              exit 1
            fi
            for l in libass mpv media3-ffmpeg; do
              case $TAG in "$l"-*) libraries=$l ;; esac
            done
            revision=${TAG##*-}
            ;;
          workflow_dispatch)
            libraries=$LIBRARY
            ;;
          pull_request)
            changed=$(git diff --name-only "$BASE" HEAD)
            # A change to what every build shares builds every library.
            if printf '%s\n' "$changed" | grep -Eq '^(scripts/lib\.sh|scripts/package\.sh|mise\.toml|\.github/)'; then
              libraries="libass mpv media3-ffmpeg"
            else
              libraries=""
              for l in libass mpv media3-ffmpeg; do
                if printf '%s\n' "$changed" | grep -qx "scripts/build-$l.sh"; then
                  libraries="$libraries $l"
                fi
              done
            fi
            ;;
          esac
          builds=$(for l in $libraries; do
            case $l in
            libass) printf '{"library":"libass","runner":"macos-latest","timeout":60,"disable":"java,shellcheck"}\n' ;;
            mpv) printf '{"library":"mpv","runner":"ubuntu-latest","timeout":240,"disable":"shellcheck"}\n' ;;
            media3-ffmpeg) printf '{"library":"media3-ffmpeg","runner":"ubuntu-latest","timeout":60,"disable":"shellcheck"}\n' ;;
            esac
          done | jq -sc .)
          {
            echo "builds=$builds"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: java,meson,ninja
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: shellcheck scripts/*.sh

  build:
    name: Build ${{ matrix.library }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    # A hung build stops at the cap; libmpv takes about an hour.
    timeout-minutes: ${{ matrix.timeout }}
    env:
      MISE_DISABLE_TOOLS: ${{ matrix.disable }}
      LIBRARY: ${{ matrix.library }}
      REVISION: ${{ needs.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - if: matrix.library == 'mpv'
        run: sudo apt-get install -y autoconf automake libtool pkg-config gperf nasm
      - run: sh "scripts/build-$LIBRARY.sh"
      - id: package
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          tag=$(sh scripts/package.sh "$LIBRARY" "$REVISION")
          # A tag releases the version the script pins.
          if [ "$EVENT" = push ] && [ "$tag" != "$TAG" ]; then
            echo "::error::the scripts pin $tag, not $TAG"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cat "dist/$tag/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.tag }}
          path: dist/${{ steps.package.outputs.tag }}/
          if-no-files-found: error

  release:
    name: Release
    needs: [plan, lint, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: dist
      - working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(ls | grep -vx notes.md)
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $assets
